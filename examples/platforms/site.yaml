            url: https://example.com/youtube
            label: subscribers
            count: 1240000
            as_of: 2027-03-01
          - platform: tiktok
            handle: "@examplecreator"
            url: https://example.com/tiktok
            count: 406800
            as_of: 2027-03-01
          - platform: instagram
            handle: "@examplecreator"
            url: https://example.com/instagram
            count: 38200
            as_of: 2027-03-01
          - platform: threads
            handle: "@examplecreator"
            url: https://example.com/threads
            count: 999
            as_of: 2027-03-01
          - platform: bluesky
            handle: examplecreator.example.com
            url: https://example.com/bluesky
