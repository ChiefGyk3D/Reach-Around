# SPDX-License-Identifier: Apache-2.0
#
# Deploy this instance to Cloudflare: the click counter Worker (with its D1
# migrations) and the static site on Pages. Runs on a push to main and by hand.
# The one-time Cloudflare, Doppler and GitHub setup is in README.md and the
# engine's docs/deploy.md ("Deploying the Worker from an instance repo").
#
# Two tiers, each its own GitHub environment and its own secret-manager
# identity:
#   staging     runs on every push to main, and by hand with target staging,
#               but only while the repository variable ALLOW_STAGING_DEPLOY is
#               exactly `true`. Set it LAST, after both environments exist and
#               are protected: GitHub creates a missing environment with no
#               protection on first use, and this variable is what keeps a first
#               push from being that first use (README.md, "One-time setup").
#   production  runs only by hand, with target production, on main, and only
#               while the repository variable ALLOW_PRODUCTION_DEPLOY is exactly
#               `true` (it is not set by default, so production is off).
#
# Jobs:
#   validate            No environment, no secret, no id-token. Checks the
#                       repository, builds the site with the pinned engine image
#                       (engine.lock), and hands the engine pin to the others.
#   worker-<tier>       Calls the engine's reusable deploy-worker.yml, pinned by
#                       commit (the commit in engine.lock; a test keeps the two
#                       equal). It applies the D1 migrations and deploys the
#                       Worker. It reads no GitHub secret: the Cloudflare token
#                       comes from the secret manager over GitHub OIDC.
#   pages-<tier>        Publishes the built site to Pages, in the tier's
#                       environment. The token is one masked output, mapped into
#                       the one wrangler step that publishes; no install script
#                       ever runs with it present.
#
# The environment's protection rules (a required reviewer, deployments limited
# to main) are the real gate on the ref. The `if` lines below, and the two
# ALLOW_ variables, are operational switches that fail closed; they are not an
# approval control, and this file cannot check that an environment is protected
# (that needs an administrator token, which no job here holds).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Which tier to deploy by hand. Production also needs ALLOW_PRODUCTION_DEPLOY set to true.
        type: choice
        options:
          - staging
          - production
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and build
    # Refuse any ref other than main (a manual run can pick another branch).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # No `environment` and no secrets here, on purpose.
    outputs:
      engine_ref: ${{ steps.lock.outputs.engine_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the repository for files that must not be committed
        run: scripts/check-repo.sh

      # Says in plain language which tab, block and field is wrong, before the
      # build. It prints no config value and fails the job on a bad config.
      - name: Check the config in plain language
        run: scripts/check-config.sh

      # The pin is parsed (never sourced) and shape-checked, so the values are
      # safe to hand to the other jobs. The Worker is deployed from, and the
      # Pages publish tool is installed from, exactly this commit.
      - name: Read the engine pin
        id: lock
        run: |
          set -eu
          # The image, repository, commit and tag must describe one release.
          scripts/read-lock.sh --release
          {
            # The script holds the upstream repository as a literal and fails
            # on any other value. It is not passed on: the later jobs use the
            # same literal.
            scripts/read-lock.sh ENGINE_REPO > /dev/null
            echo "engine_ref=$(scripts/read-lock.sh ENGINE_REF)"
          } >> "$GITHUB_OUTPUT"

      # Plain values only; no secret. The two tiers must not share a Worker or a
      # Pages project, and neither Worker may be the engine's own test Worker, or
      # one deploy would replace another's (a Pages project has one production
      # branch, so a shared project would let staging publish to production).
      # The called workflow checks the Worker name again. Pages names are
      # compared after lowercasing, and [[ =~ ]] tests the whole value, so a
      # second line cannot hide behind a valid first one.
      # The staging and production settings are distinct. Plain values only;
      # it prints only the NAME of a setting that is not distinct.
      - name: Check the tier settings are distinct
        env:
          STAGING_WORKER_NAME: ${{ vars.STAGING_WORKER_NAME }}
          PRODUCTION_WORKER_NAME: ${{ vars.PRODUCTION_WORKER_NAME }}
          STAGING_PAGES_PROJECT: ${{ vars.STAGING_PAGES_PROJECT }}
          PRODUCTION_PAGES_PROJECT: ${{ vars.PRODUCTION_PAGES_PROJECT }}
          STAGING_D1_DATABASE_ID: ${{ vars.STAGING_D1_DATABASE_ID }}
          PRODUCTION_D1_DATABASE_ID: ${{ vars.PRODUCTION_D1_DATABASE_ID }}
          STAGING_RATELIMIT_NAMESPACE_ID: ${{ vars.STAGING_RATELIMIT_NAMESPACE_ID }}
          PRODUCTION_RATELIMIT_NAMESPACE_ID: ${{ vars.PRODUCTION_RATELIMIT_NAMESPACE_ID }}
          STAGING_SITE_HOST: ${{ vars.STAGING_SITE_HOST }}
          PRODUCTION_SITE_HOST: ${{ vars.PRODUCTION_SITE_HOST }}
          STAGING_ZONE_NAME: ${{ vars.STAGING_ZONE_NAME }}
          PRODUCTION_ZONE_NAME: ${{ vars.PRODUCTION_ZONE_NAME }}
          DOPPLER_IDENTITY_ID_STAGING: ${{ vars.DOPPLER_IDENTITY_ID_STAGING }}
          DOPPLER_IDENTITY_ID_PRODUCTION: ${{ vars.DOPPLER_IDENTITY_ID_PRODUCTION }}
        run: scripts/check-tiers.sh

      - name: Check the plain configuration values
        env:
          STAGING_WORKER_NAME: ${{ vars.STAGING_WORKER_NAME }}
          PRODUCTION_WORKER_NAME: ${{ vars.PRODUCTION_WORKER_NAME }}
          STAGING_PAGES_PROJECT: ${{ vars.STAGING_PAGES_PROJECT }}
          PRODUCTION_PAGES_PROJECT: ${{ vars.PRODUCTION_PAGES_PROJECT }}
          DOPPLER_PROJECT: ${{ vars.DOPPLER_PROJECT }}
        run: |
          set -eu
          pages_re='^[a-z0-9][a-z0-9-]{0,57}$'
          staging_pages="${STAGING_PAGES_PROJECT:-}"
          staging_pages="${staging_pages,,}"
          [[ "$staging_pages" =~ $pages_re ]] \
            || { echo "::error::STAGING_PAGES_PROJECT is not set to a plain Pages project name (README.md)"; exit 1; }
          if [ -n "${PRODUCTION_PAGES_PROJECT:-}" ]; then
            production_pages="${PRODUCTION_PAGES_PROJECT,,}"
            [[ "$production_pages" =~ $pages_re ]] \
              || { echo "::error::PRODUCTION_PAGES_PROJECT is not a plain Pages project name"; exit 1; }
            [ "$staging_pages" != "$production_pages" ] \
              || { echo "::error::STAGING_PAGES_PROJECT and PRODUCTION_PAGES_PROJECT must be different Pages projects"; exit 1; }
          fi
          name_re='^[a-z0-9][a-z0-9-]{0,62}$'
          [[ "${STAGING_WORKER_NAME:-}" =~ $name_re ]] \
            || { echo "::error::STAGING_WORKER_NAME is not set to a plain Worker name (README.md)"; exit 1; }
          if [ -n "${PRODUCTION_WORKER_NAME:-}" ]; then
            [[ "$PRODUCTION_WORKER_NAME" =~ $name_re ]] \
              || { echo "::error::PRODUCTION_WORKER_NAME is not a plain Worker name"; exit 1; }
            [ "$STAGING_WORKER_NAME" != "$PRODUCTION_WORKER_NAME" ] \
              || { echo "::error::STAGING_WORKER_NAME and PRODUCTION_WORKER_NAME must differ"; exit 1; }
          fi
          for name in "$STAGING_WORKER_NAME" "${PRODUCTION_WORKER_NAME:-}"; do
            [ "$name" != "reach-around-clicks" ] \
              || { echo "::error::reach-around-clicks is the engine's own test Worker; pick another name"; exit 1; }
          done
          project_re='^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$'
          [[ "${DOPPLER_PROJECT:-}" =~ $project_re ]] \
            || { echo "::error::DOPPLER_PROJECT is not set to a plain project name (README.md)"; exit 1; }

      # Builds with the engine image named by digest in engine.lock. A bad
      # config fails here, before anything is deployed.
      - name: Build the site with the pinned engine
        run: >-
          scripts/validate.sh --out "$RUNNER_TEMP/site-out"
          --manifest "$RUNNER_TEMP/site-manifest/manifest.json"
          --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-out
          path: ${{ runner.temp }}/site-out
          if-no-files-found: error
          retention-days: 1

      # The manifest is its own artifact, from a directory beside the site,
      # so it is never in the Pages upload.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-manifest
          path: ${{ runner.temp }}/site-manifest/manifest.json
          if-no-files-found: error
          retention-days: 1

  # ---- staging ---------------------------------------------------------------

  worker-staging:
    name: Deploy the staging Worker
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' && vars.ALLOW_STAGING_DEPLOY == 'true' && github.event_name == 'push'
      || github.ref == 'refs/heads/main' && vars.ALLOW_STAGING_DEPLOY == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'staging'
    # The permissions are checked when this file is parsed, so the call needs
    # what the called workflow asks for even when the job is skipped.
    permissions:
      contents: read
      id-token: write # OIDC to the secret manager; only the four deploy jobs
    uses: ChiefGyk3D/Reach-Around/.github/workflows/deploy-worker.yml@16efbd68a535b0bdd3dc96b5d7684e61d82bf609 # v0.3.0-rc.6
    # Values are literals or repository variables (a calling job cannot read an
    # environment's own variables). None is a secret, and no secret is passed.
    with:
      environment: staging
      engine_repo: ChiefGyk3D/Reach-Around
      engine_ref: ${{ needs.validate.outputs.engine_ref }}
      worker_name: ${{ vars.STAGING_WORKER_NAME }}
      manifest_artifact: site-manifest
      manifest_file: manifest.json
      site_artifact: site-out
      doppler_identity_id: ${{ vars.DOPPLER_IDENTITY_ID_STAGING }}
      doppler_project: ${{ vars.DOPPLER_PROJECT }}
      doppler_config: dev
      cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      d1_database_id: ${{ vars.STAGING_D1_DATABASE_ID }}
      ratelimit_namespace_id: ${{ vars.STAGING_RATELIMIT_NAMESPACE_ID }}
      site_host: ${{ vars.STAGING_SITE_HOST }}
      zone_name: ${{ vars.STAGING_ZONE_NAME }}

  pages-staging:
    name: Publish the staging site
    needs: [validate, worker-staging]
    if: >-
      github.ref == 'refs/heads/main' && vars.ALLOW_STAGING_DEPLOY == 'true' && github.event_name == 'push'
      || github.ref == 'refs/heads/main' && vars.ALLOW_STAGING_DEPLOY == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      # Only to read the token from the secret manager over OIDC.
      id-token: write # OIDC to the secret manager; only the four deploy jobs
    # No job-level env: the Cloudflare token is set only on the one wrangler
    # step that publishes, never where install scripts could run.
    steps:
      # The image holds only the site builder, so the publish tool comes from
      # the engine repository at the pinned commit.
      - name: Fetch the Worker source at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ChiefGyk3D/Reach-Around
          ref: ${{ needs.validate.outputs.engine_ref }}
          path: engine
          sparse-checkout: worker
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-out
          path: site-out

      # No secret in this step: it only checks the shape of plain values.
      - name: Check configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.STAGING_PAGES_PROJECT }}
          # Only to refuse it: staging must never publish into this project.
          PRODUCTION_PAGES_PROJECT: ${{ vars.PRODUCTION_PAGES_PROJECT }}
        run: |
          set -eu
          [[ "${CLOUDFLARE_ACCOUNT_ID:-}" =~ ^[0-9a-f]{32}$ ]] \
            || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not a 32-character id (README.md)"; exit 1; }
          project="${PAGES_PROJECT:-}"
          project="${project,,}"
          [[ "$project" =~ ^[a-z0-9-]{1,58}$ ]] \
            || { echo "::error::STAGING_PAGES_PROJECT is not a valid project name (README.md)"; exit 1; }
          other="${PRODUCTION_PAGES_PROJECT:-}"
          other="${other,,}"
          [ "$project" != "$other" ] \
            || { echo "::error::STAGING_PAGES_PROJECT equals PRODUCTION_PAGES_PROJECT; staging must publish to its own Pages project"; exit 1; }

      # --ignore-scripts: wrangler runs without its dependencies' install
      # scripts, so none run. This step has no secret in its environment.
      - name: Install Worker dependencies
        working-directory: engine/worker
        run: npm ci --ignore-scripts

      # Smoke test with no secret in the environment.
      - name: Confirm wrangler runs
        working-directory: engine/worker
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npx --no-install wrangler --version

      # The deploy uses the rotating key value (CLOUDFLARE_KEY_VALUE) as the
      # Cloudflare API token. The action returns only that one name, masked, as
      # one output: nothing is written to the job environment, so only a step
      # that maps it into its own env can read it. No GitHub secret is read,
      # and `required` fails the job when the secret manager gives nothing.
      - name: Fetch Cloudflare credentials from the secret manager
        id: cf_doppler
        uses: ChiefGyk3D/git-your-ship-together/.github/actions/doppler-secrets@01f397834f7acc553593abefbba135b18f580730 # v1.34.0
        with:
          project: ${{ vars.DOPPLER_PROJECT }}
          config: dev
          export: outputs
          names: CLOUDFLARE_KEY_VALUE
          identity-id: ${{ vars.DOPPLER_IDENTITY_ID_STAGING }}
          required: "true"

      # The only step that carries the Cloudflare token.
      - name: Publish the site to Pages
        working-directory: engine/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ fromJSON(steps.cf_doppler.outputs.secrets).CLOUDFLARE_KEY_VALUE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.STAGING_PAGES_PROJECT }}
          WRANGLER_SEND_METRICS: "false"
        run: >-
          npx --no-install wrangler pages deploy ../../site-out
          --project-name "$PAGES_PROJECT"
          --branch staging
          --commit-dirty=true

  # ---- production ------------------------------------------------------------
  # Off by default: it needs a manual run on main with target production AND the
  # repository variable ALLOW_PRODUCTION_DEPLOY set to exactly `true`. All four
  # conditions are on every production job; a test proves none can be dropped
  # and that no push can run them.

  worker-production:
    name: Deploy the production Worker
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.target == 'production' && vars.ALLOW_PRODUCTION_DEPLOY == 'true'
    permissions:
      contents: read
      id-token: write # OIDC to the secret manager; only the four deploy jobs
    uses: ChiefGyk3D/Reach-Around/.github/workflows/deploy-worker.yml@16efbd68a535b0bdd3dc96b5d7684e61d82bf609 # v0.3.0-rc.6
    with:
      environment: production
      engine_repo: ChiefGyk3D/Reach-Around
      engine_ref: ${{ needs.validate.outputs.engine_ref }}
      worker_name: ${{ vars.PRODUCTION_WORKER_NAME }}
      manifest_artifact: site-manifest
      manifest_file: manifest.json
      site_artifact: site-out
      doppler_identity_id: ${{ vars.DOPPLER_IDENTITY_ID_PRODUCTION }}
      doppler_project: ${{ vars.DOPPLER_PROJECT }}
      doppler_config: prd
      cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      d1_database_id: ${{ vars.PRODUCTION_D1_DATABASE_ID }}
      ratelimit_namespace_id: ${{ vars.PRODUCTION_RATELIMIT_NAMESPACE_ID }}
      site_host: ${{ vars.PRODUCTION_SITE_HOST }}
      zone_name: ${{ vars.PRODUCTION_ZONE_NAME }}

  pages-production:
    name: Publish the production site
    needs: [validate, worker-production]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.target == 'production' && vars.ALLOW_PRODUCTION_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      # Only to read the token from the secret manager over OIDC.
      id-token: write # OIDC to the secret manager; only the four deploy jobs
    steps:
      - name: Fetch the Worker source at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ChiefGyk3D/Reach-Around
          ref: ${{ needs.validate.outputs.engine_ref }}
          path: engine
          sparse-checkout: worker
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-out
          path: site-out

      # No secret in this step: it only checks the shape of plain values.
      - name: Check configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PRODUCTION_PAGES_PROJECT }}
        run: |
          set -eu
          [[ "${CLOUDFLARE_ACCOUNT_ID:-}" =~ ^[0-9a-f]{32}$ ]] \
            || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not a 32-character id (README.md)"; exit 1; }
          [[ "${PAGES_PROJECT:-}" =~ ^[a-z0-9-]{1,58}$ ]] \
            || { echo "::error::PRODUCTION_PAGES_PROJECT is not a valid project name (README.md)"; exit 1; }

      - name: Install Worker dependencies
        working-directory: engine/worker
        run: npm ci --ignore-scripts

      - name: Confirm wrangler runs
        working-directory: engine/worker
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npx --no-install wrangler --version

      - name: Fetch Cloudflare credentials from the secret manager
        id: cf_doppler
        uses: ChiefGyk3D/git-your-ship-together/.github/actions/doppler-secrets@01f397834f7acc553593abefbba135b18f580730 # v1.34.0
        with:
          project: ${{ vars.DOPPLER_PROJECT }}
          config: prd
          export: outputs
          names: CLOUDFLARE_KEY_VALUE
          identity-id: ${{ vars.DOPPLER_IDENTITY_ID_PRODUCTION }}
          required: "true"

      - name: Publish the site to Pages
        working-directory: engine/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ fromJSON(steps.cf_doppler.outputs.secrets).CLOUDFLARE_KEY_VALUE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PRODUCTION_PAGES_PROJECT }}
          WRANGLER_SEND_METRICS: "false"
        run: >-
          npx --no-install wrangler pages deploy ../../site-out
          --project-name "$PAGES_PROJECT"
          --branch main
          --commit-dirty=true
