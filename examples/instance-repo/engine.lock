# The engine version this instance builds and deploys with. Three lines, and
# they must move together (Renovate groups them into one pull request):
#
#   ENGINE_IMAGE  the published container image, by tag AND digest. The digest
#                 is what is pulled; the tag is only a label for humans.
#   ENGINE_REPO   the engine's source repository (the Worker code is taken
#                 from here, because the image holds only the site builder).
#   ENGINE_REF    the commit of that release tag, with the tag in a comment.
#
# Read by scripts/read-lock.sh, which checks each value's shape. Nothing in
# this file is a secret.
ENGINE_IMAGE=ghcr.io/chiefgyk3d/reach-around:0.2.0@sha256:bec09d709701622a9dadff40ab5092de6e32f3006106bc52925e9929471fa071
ENGINE_REPO=ChiefGyk3D/Reach-Around
ENGINE_REF=46eb5c26b2d8c95825b7904ea860b502740e1d76 # v0.2.0
