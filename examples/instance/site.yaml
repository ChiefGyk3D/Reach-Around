# Synthetic example config. Every name and URL here is made up.
version: 1
timezone: America/New_York
# Optional. The UTC day the site went live (YYYY-MM-DD); the media kit prints
# "Live since <date> (UTC)". Set it on the day the switch is verified. Staging
# may leave it out. See docs/config.md, "cutover_date".
# cutover_date: 2026-11-08
# Optional page titles. Uncomment to try; see docs/config.md, "Page titles".
# title_template: "{tab} | {site}"
creator:
  name: Example Creator
  # title: Example Creator Links
  avatar: media/mascot.svg
  favicon: media/mascot.svg
  socials:
    - name: Example Video
      url: https://video.example.com/@example
      icon: youtube
    - name: Example Feed
      url: https://feed.example.com/rss
      icon: rss
    - name: Example Mail
      url: https://mail.example.com/contact
      icon: email
    # A social or link can open another tab: url: "tab:<tab-id>" or
    # "tab:<tab-id>#<fragment>". See docs/customizing.md, "Linking to another tab".
    - name: Example Chat
      url: https://chat.example.invalid/example
      icon: chat
theme:
  mode: dark
  colors:
    accent: "#FBB03B"
    on_accent: "#1A1A1A"
    bg: "#0F0F0F"
    surface: "#202020"
    text: "#F0F0F0"
    muted: "#B5ADA2"
    border: "#3A3530"
  fonts:
    heading: fonts/orbitron-wght.ttf
    license: fonts/OFL-Orbitron.txt
  mascot: media/mascot.svg
  mascot_opacity: 0.12
  mascot_size: 40rem
  mascot_position: center bottom
  button_style: square
  radius: 0.25rem
  # Optional border frames (docs/customizing.md, "Border frames"). none (the
  # default), minimal (light brackets and thin rules) or faithful (the brand
  # button art on the featured link and the big buttons, minimal on tabs, links
  # and headers, nothing on small icons, chips, the footer and list rows). A
  # frame is a border only: it keeps each element's own fill. Dark only.
  # frame_classes overrides one class, e.g. frame_classes: {tab: none}.
  frame: faithful
# Optional profile card after the content of every page. Uncomment to try; this
# changes the built pages, so the golden files change with it. See
# docs/config.md, "profile_card".
# profile_card:
#   tags: [Retro games, Security, Amateur radio]
#   button:
#     label: Download the media kit
#     url: https://media.example.com/kit

# The footer credit link is on by default. Uncomment to turn it off or reword
# it (this changes the built pages, so the golden files change with it). See
# docs/config.md, "footer".
# footer:
#   credit: false
#   credit_text: Built with Reach Around
disclosure: This page uses affiliate links. Example Creator may earn a commission.
tabs:
  - id: start-here
    title: Start Here
    # page_title: Welcome to Example Creator Links
    blocks:
      - id: home-page
        title: Example Home Page
        subtitle: The main site
        url: https://example.com/
        icon: link
        featured: true
        # A round picture instead of the icon (a file in this folder, at most
        # 256 KiB). Uncomment, add the file, and see docs/customizing.md.
        # image: media/thumbs/home.jpg
        # image_alt: The example home page logo
      - id: gear-picks
        title: Gear Picks
        subtitle: Things used on the show
        collapsed: true
        links:
          - id: example-mic
            title: Example Microphone
            url: https://shop.example.com/mic?ref=example
            affiliate: true
          - id: example-stand
            title: Example Boom Stand
            url: https://shop.example.com/stand
          # Three buttons: the odd last one is centered under the pair.
          - id: example-cable
            title: Example Cable Kit
            url: https://shop.example.com/cable
  - id: events
    title: Events
    blocks:
      - id: spring-meetup
        title: Spring Meetup Tickets
        url: https://tickets.example.invalid/spring
        show_from: 2027-03-01
        show_until: 2027-04-15
