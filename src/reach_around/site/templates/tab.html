{% extends "base.html" %}
{% block content %}
{% if blocks %}
<ul class="blocks">
{% for block in blocks %}
{% include "blocks/" ~ block_kind(block) ~ ".html" %}
{% endfor %}
</ul>
{% else %}
<p class="empty">Nothing here right now.</p>
{% endif %}
{% endblock %}
