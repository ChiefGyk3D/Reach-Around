{% from "_macros.html" import link_anchor %}
<li class="block block-section">
<details class="section"{% if not block.collapsed %} open{% endif %}>
<summary>{{ block.title }}</summary>
{% if block.subtitle %}
<p class="section-subtitle">{{ block.subtitle }}</p>
{% endif %}
<ul class="section-links layout-{{ block.layout }}">
{% for link in block.links %}
<li>{{ link_anchor(link, click_tracking) }}</li>
{% endfor %}
</ul>
</details>
</li>
