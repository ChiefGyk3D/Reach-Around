{% set src = block.src if ":" in block.src else root ~ block.src %}
<li class="block block-image">
{% if block.link %}
<a class="image-link" href="{{ block.link }}" rel="noopener noreferrer"><img class="image" src="{{ src }}" alt="{{ block.alt }}" loading="lazy" referrerpolicy="no-referrer"></a>
{% else %}
<img class="image" src="{{ src }}" alt="{{ block.alt }}" loading="lazy" referrerpolicy="no-referrer">
{% endif %}
</li>
