{% macro link_anchor(link, track) -%}
<a class="link" href="{{ link.url }}"{% if track %} ping="/e/c/{{ link.id }}" data-link-id="{{ link.id }}"{% endif %} rel="{{ 'sponsored noopener noreferrer' if link.affiliate else 'noopener noreferrer' }}">
<span class="link-title">{{ link.title }}</span>
{% if link.subtitle %}<span class="link-subtitle">{{ link.subtitle }}</span>{% endif %}
</a>
{%- endmacro %}
