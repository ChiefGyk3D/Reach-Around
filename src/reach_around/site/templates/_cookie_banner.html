<section class="cookie-banner" aria-label="Cookie notice">
<p>{{ cookie_text }}</p>
<form method="get" action="{{ root }}privacy/#cookies">
<button type="submit" name="cookies" value="preferences">Preferences</button>
<button type="submit" name="cookies" value="reject">Reject</button>
<button type="submit" name="cookies" value="accept">Accept</button>
</form>
</section>
