{% import "_frames.html" as frames with context %}
{% if nav|length > 1 %}
<nav class="tabs" aria-label="Pages">
<ul>
{% for item in nav %}
<li><a{% if frame_plan %} class="{{ frames.cls("tab")|trim }}"{% endif %} href="{{ item.href }}"{% if item.current %} aria-current="page"{% endif %}>{{ item.title }}{% if item.live %}<span class="live-badge" data-live-badge hidden><span class="live-dot" aria-hidden="true"></span>LIVE</span>{% endif %}</a></li>
{% endfor %}
</ul>
</nav>
{% endif %}
