# Cloudflare Worker for Reach Around: the write-only click counter.
# All ids below are clearly fake placeholders. Replace them in your own
# deployment; never commit real account, database or namespace ids.
name = "reach-around-clicks"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# The host of the static site. Requests from any other origin are ignored.
SITE_HOST = "links.example.test"
# JSON array of link ids, copied from the build manifest.
LINK_IDS = '["example-one","example-two"]'
# Optional kill switch, deliberately unset here. "1" or "true" (any case) makes
# the click route return its usual empty 204 without touching D1 or the rate
# limiter; anything else leaves it on. Read on every request. Flip it with
#   npx wrangler deploy --var CLICKS_KILL:1   (off)   /   --var CLICKS_KILL:0   (on)
# CLICKS_KILL = "1"

[[d1_databases]]
binding = "DB"
database_name = "reach-around-clicks"
database_id = "00000000-0000-0000-0000-000000000000" # placeholder, not a real id
migrations_dir = "migrations"

# Workers Rate Limiting binding: 20 checks per client per 60 seconds.
[[ratelimits]]
name = "CLICK_LIMITER"
namespace_id = "1001" # placeholder, not a real id
  [ratelimits.simple]
  limit = 20
  period = 60

# One hourly run (Free allows 5 cron triggers per account): click purge, then
# the page-view rollup (a day is rolled once its UTC midnight plus
# ROLLUP_GRACE_HOURS has passed), then the page-view purge. Each run stays
# inside QUERY_BUDGET D1 queries (default 40; Free allows 50, a batch counts
# as one), so a long backlog simply continues on the next run. The :05 run at
# 00:05 UTC keeps the daily visitor hash within about an hour of its day ending.
[triggers]
crons = ["5 * * * *"]

# Page views (POST /e/v/:pageId). Placeholders only; real values come from the
# build manifest and `wrangler secret`, never from this file.
# PAGE_IDS = '["home"]'            # JSON array of tab ids, from the build manifest
# VIEWS_KILL = "1"                 # kill switch, same rules as CLICKS_KILL
# GEO_LEVEL = "city"               # country | region | city
# BOTS_MODE = "count"              # count | drop
# VIEWS_PER_HOUR = "120"           # global human budget
# BOT_VIEWS_PER_HOUR = "30"        # global bot budget
# CLIENT_VIEWS_PER_HOUR = "60"     # per-client cap (ceiling 1000); clamped to half the human or a quarter of the bot budget
# RAW_KEEP_DAYS = "7"              # raw view retention (ceiling 90)
# QUERY_BUDGET = "40"              # D1 queries per cron run (5 to 900)
# MIN_CELL = "3"                   # rollup cells under this many views fold into other (1 to 50)
# ROLLUP_GRACE_HOURS = "2"         # wait this long after UTC midnight before rolling a day (0 to 12)
# TOP_SOURCES = "50"               # referrer and utm labels kept per day
# UV_ENABLED = "1"
# UV_BITS = "64"                 # visitor hash width: minimum and default 64, at most 128
# VIEW_HASH_SECRET is a SECRET: `npx wrangler secret put VIEW_HASH_SECRET`
# (32 random bytes, base64). Never put it in this file. REQUIRED: without it
# the page-view route records nothing (it fails closed).
#
# Per-client burst limiter, much stricter than the global budget: 5 views per
# client per 60 seconds (a real visitor sends one beacon per page load).
# [[ratelimits]]
# name = "VIEW_LIMITER"
# namespace_id = "1002" # placeholder, not a real id
#   [ratelimits.simple]
#   limit = 5
#   period = 60

# The click pings use the relative path /e/c/<id>, so the browser sends them to
# the site's own host. Route the Worker there in your deployment (placeholder
# host; replace it with your site host and zone):
# [[routes]]
# pattern = "links.example.test/e/*"
# zone_name = "example.test"
