# Cloudflare Worker for Reach Around: the write-only click counter.
# All ids below are clearly fake placeholders. Replace them in your own
# deployment; never commit real account, database or namespace ids.
name = "reach-around-clicks"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# The host of the static site. Requests from any other origin are ignored.
SITE_HOST = "links.example.test"
# JSON array of link ids, copied from the build manifest.
LINK_IDS = '["example-one","example-two"]'
# Optional kill switch, deliberately unset here. "1" or "true" (any case) makes
# the click route return its usual empty 204 without touching D1 or the rate
# limiter; anything else leaves it on. Read on every request. Flip it with
#   npx wrangler deploy --var CLICKS_KILL:1   (off)   /   --var CLICKS_KILL:0   (on)
# CLICKS_KILL = "1"

[[d1_databases]]
binding = "DB"
database_name = "reach-around-clicks"
database_id = "00000000-0000-0000-0000-000000000000" # placeholder, not a real id
migrations_dir = "migrations"

# Workers Rate Limiting binding: 20 checks per client per 60 seconds.
[[ratelimits]]
name = "CLICK_LIMITER"
namespace_id = "1001" # placeholder, not a real id
  [ratelimits.simple]
  limit = 20
  period = 60

# Retention: purge click rows older than 90 days, daily.
[triggers]
crons = ["17 4 * * *"]

# The click pings use the relative path /e/c/<id>, so the browser sends them to
# the site's own host. Route the Worker there in your deployment (placeholder
# host; replace it with your site host and zone):
# [[routes]]
# pattern = "links.example.test/e/*"
# zone_name = "example.test"
