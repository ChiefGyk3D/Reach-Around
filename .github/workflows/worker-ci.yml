# SPDX-License-Identifier: Apache-2.0
name: Worker CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  worker:
    name: Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  # Our convention names the merge gate "CI green". GitHub Actions has no GYST
  # Node reusable workflow yet, so this local job stands in for it.
  ci-green:
    name: CI green
    runs-on: ubuntu-latest
    needs: [worker]
    if: always()
    steps:
      - name: Require the test job to have succeeded
        env:
          RESULT: ${{ needs.worker.result }}
        run: |
          echo "worker: $RESULT"
          test "$RESULT" = "success"
