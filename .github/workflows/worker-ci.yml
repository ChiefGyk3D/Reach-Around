# SPDX-License-Identifier: Apache-2.0
name: Worker CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  worker:
    name: Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  # Our convention names the merge gate "CI green". GitHub Actions has no GYST
  # Node reusable workflow yet, so this local job stands in for it.
  ci-green:
    name: CI green
    runs-on: ubuntu-latest
    needs: [worker]
    if: always()
    steps:
      - name: Require the test job to have succeeded
        env:
          RESULT: ${{ needs.worker.result }}
        run: |
          echo "worker: $RESULT"
          test "$RESULT" = "success"
