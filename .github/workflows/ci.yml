# SPDX-License-Identifier: Apache-2.0
# The generic legs (ruff, mypy, the pytest matrix, the smoke test, the workflow lint) are
# ChiefGyk3D/git-your-ship-together's python-ci.yml; it reports its gate as `CI green`, here
# `ci / CI green`. Its `docker` job builds the Containerfile; the one project-specific job
# here, `podman`, runs the container smoke test under Podman.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-ci.yml@9e0d7b2e7e8530e2b1bb200ecb4fbf6de021881f # v1.38.0
    permissions:
      contents: read
      id-token: write   # Doppler OIDC, when an identity is configured; python-ci keeps it off the test job
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      python-versions: '["3.11", "3.12", "3.13"]'
      install-command: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements-dev.txt
        pip install --no-deps -e .
      # pytest-xdist: the suite is ~6,600 tests and ran serially (3.12 took 13m22s of a 15m
      # limit). Coverage is only uploaded from the coverage leg (3.13), so the other legs skip
      # it: settrace coverage made 3.12 2.7x slower than 3.13 (802s vs 301s).
      # `xdist-workers` alone does nothing: python-ci only installs pytest-xdist and sets
      # PYTEST_ADDOPTS=-n when `xdist: true` (#826; the 3.13 leg logged `xdist: false`).
      xdist: true
      xdist-workers: auto
      test-command: |
        if [ "$(python -c 'import sys; print(f"{sys.version_info[0]}.{sys.version_info[1]}")')" = "3.13" ]; then
          pytest --cov=reach_around --cov-report=xml
        else
          pytest
        fi
      lint-install-command: pip install --require-hashes -r requirements-dev.txt
      lint-command: |
        ruff check .
        ruff format --check .
        python3 -I scripts/check-token-drift
        python3 -I scripts/check-public-assets.py
        /usr/bin/python3 -I scripts/check-edge.py --offline
        python3 -I .github/scripts/check-migrations.py
        python3 -I scripts/check-wiki-scrub.py
        python3 -I scripts/changelog-assemble.py verify
        python3 -I scripts/changelog-assemble.py check-pr
      typecheck-install-command: |
        pip install --require-hashes -r requirements-dev.txt
        pip install --no-deps -e .
      typecheck-command: mypy
      smoke-command: reach-around --version
      docker-build: true
      dockerfile: Containerfile
      egress-policy: block
      # Docker Hub redirects some layer blobs to this S3 host; python-ci's default list
      # lacks it, so the Container build failed on a blob fetch (#933, GYST#284).
      extra-allowed-endpoints: docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443

  podman:
    name: Podman smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443
            auth.docker.io:443
            deb.debian.org:80
            docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
            files.pythonhosted.org:443
            github.com:443
            production.cloudfront.docker.com:443
            pypi.org:443
            registry-1.docker.io:443
          disable-telemetry: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and run the image under Podman
        env:
          CONTAINER_ENGINE: podman
        run: bash tests/test_container_smoke.sh
