# SPDX-License-Identifier: Apache-2.0
# The generic legs (ruff, mypy, the pytest matrix, the smoke test, the workflow lint) are
# ChiefGyk3D/git-your-ship-together's python-ci.yml; it reports its gate as `CI green`, here
# `ci / CI green`. Its `docker` job builds the Containerfile; the one project-specific job
# here, `podman`, runs the container smoke test under Podman.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-ci.yml@f344c638e1316d43514a41e4a22f172583c271fc # v1.26.0
    permissions:
      contents: read
      id-token: write   # Doppler OIDC, when an identity is configured; python-ci keeps it off the test job
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      python-versions: '["3.11", "3.12", "3.13"]'
      install-command: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements-dev.txt
        pip install --no-deps -e .
      test-command: pytest --cov=reach_around --cov-report=xml
      lint-install-command: pip install --require-hashes -r requirements-dev.txt
      lint-command: |
        ruff check .
        ruff format --check .
      typecheck-install-command: |
        pip install --require-hashes -r requirements-dev.txt
        pip install --no-deps -e .
      typecheck-command: mypy
      smoke-command: reach-around --version
      docker-build: true
      dockerfile: Containerfile
      egress-policy: block

  podman:
    name: Podman smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443
            auth.docker.io:443
            files.pythonhosted.org:443
            github.com:443
            production.cloudfront.docker.com:443
            pypi.org:443
            registry-1.docker.io:443
          disable-telemetry: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and run the image under Podman
        env:
          CONTAINER_ENGINE: podman
        run: bash tests/test_container_smoke.sh
