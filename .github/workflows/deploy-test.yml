# SPDX-License-Identifier: Apache-2.0
#
# Deploy of the Worker and the static site to the TEST subdomain, by hand from
# main and once a day on a schedule (so the follower counts stay fresh). One-time
# Cloudflare setup is in docs/deploy.md. Nothing here runs on a push or a pull
# request.
#
# A `counts` job runs first (issue #288). It holds the count-source keys, can
# only read the repository, and hands one numbers.json to the build as data.
# Where the keys come from is the maintainer's choice: GitHub Actions secrets
# (the default, nothing else to set up) or Doppler over GitHub OIDC (opt in by
# setting the repository variables DOPPLER_COUNTS_IDENTITY_ID,
# DOPPLER_COUNTS_PROJECT and DOPPLER_COUNTS_CONFIG; no long-lived token). The
# counts identity is its own: never the DOPPLER_IDENTITY_ID the deploy job
# uses. With neither, the keyless
# sources (Mastodon, Bluesky, GitHub) still refresh and keyed sources are
# skipped. Setup: docs/deploy.md, "Daily follower counts".
#
# Then two more jobs: `build` has no secrets and no environment, so pip install scripts
# never see the Cloudflare token. `deploy` fetches the token from Doppler after
# the last install step; the Doppler action exports its whole config into the
# job environment, so from that step on the token is inherited by every later
# step and action post-run hook, not only the wrangler steps (narrowing that
# waits on git-your-ship-together#207; see docs/deploy.md). The optional
# cache-purge token is a separate secret on the last step only. Both jobs run
# under harden-runner in block mode; the allow-lists are unmeasured.
#
# Caching: every static and media file is published under a content-hashed name
# and pages are revalidated, so a deploy shows at once without any purge. The
# purge step at the end is an optional backstop for paths that already exist at
# the edge (see docs/deploy.md, "Caching and stale files").
name: Deploy to test

on:
  workflow_dispatch:
    inputs:
      skip_counts:
        description: >-
          Skip the follower-counts refresh and build with the committed
          numbers.json (for a manual redeploy when a count source is down).
        type: boolean
        default: false
  schedule:
    # Once a day, 06:23 UTC (off the top of the hour, when runs start late).
    - cron: "23 6 * * *"

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  # Builds the engine and its hashed dependencies into wheels. This is the only
  # job that runs build scripts for the counts refresh, and it has no OIDC
  # permission and no keys. The counts job below installs wheels only.
  wheels:
    name: Build the engine wheels
    if: github.ref == 'refs/heads/main' && !inputs.skip_counts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # The hash of the engine wheel (not a secret). The counts job refuses a
    # wheel that does not match it.
    outputs:
      engine_sha256: ${{ steps.hash.outputs.engine_sha256 }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit # as in the build job: artifact hosts vary per run

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build wheels
        run: |
          set -eu
          python -m pip install --require-hashes -r requirements-build.txt
          python -m pip download --only-binary :all: --no-deps --require-hashes -r requirements.txt -d wheels-out
          python -m pip wheel --no-deps --no-build-isolation . -w wheels-out

      - name: Hash the engine wheel
        id: hash
        run: |
          set -eu
          set -- wheels-out/reach_around-*.whl
          if [ "$#" != 1 ] || [ ! -f "$1" ]; then
            echo "::error::expected exactly one reach_around wheel"
            exit 1
          fi
          sum="$(sha256sum "$1")"
          echo "engine_sha256=${sum%% *}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-wheels
          path: wheels-out
          if-no-files-found: error
          retention-days: 1

  # The keys are fetched and used in this one job. It can only read the
  # repository, installs no source code (wheels only), and its single OIDC use
  # is the optional Doppler step. A job output cannot carry the keys to another
  # job (GitHub drops outputs that contain masked values, and the fetch action
  # forbids it), so the fetch and the one step that uses them stay together.
  counts:
    name: Refresh follower counts
    needs: wheels
    # Refuse any ref other than main; skipped on request (manual runs only).
    if: github.ref == 'refs/heads/main' && !inputs.skip_counts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # the keys are in this job, so it cannot write
      id-token: write # Doppler OIDC (optional); never a write to the repository
    # A protected environment of its own (restrict it to the main branch; a
    # required reviewer is optional, docs/deploy.md). The environment subject
    # does not name a workflow, so docs/deploy.md also covers the workflow
    # claim and the review settings that limit who can target it. No
    # job-level env, on purpose.
    environment: counts-secrets
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          # audit, not block, for two reasons that cannot be listed: the wheels
          # artifact download goes to a blob host whose name varies per run
          # (no wildcards here), and the Mastodon and Matrix sources are
          # configurable hosts named in the config. The fixed hosts it does
          # use are github.com, api.github.com, the artifact hosts, the Doppler
          # API, and per source kind: public.api.bsky.app, discord.com,
          # www.googleapis.com, id.twitch.tv, api.twitch.tv. It needs no PyPI
          # host: it installs from the artifact. See docs/deploy.md.
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-wheels
          path: wheels-in

      # Installs happen before any key is fetched, and only from the wheels
      # the `wheels` job built: --no-index --only-binary means no setup script
      # and no build backend runs in this job, which can ask for an OIDC token.
      - name: Install the engine from wheels
        env:
          ENGINE_SHA256: ${{ needs.wheels.outputs.engine_sha256 }}
        run: |
          set -eu
          python -m pip install --no-index --find-links wheels-in --only-binary :all: --require-hashes -r requirements.txt
          set -- wheels-in/reach_around-*.whl
          if [ "$#" != 1 ] || [ ! -f "$1" ]; then
            echo "::error::expected exactly one reach_around wheel"
            exit 1
          fi
          sum="$(sha256sum "$1")"
          if [ -z "$ENGINE_SHA256" ] || [ "${sum%% *}" != "$ENGINE_SHA256" ]; then
            echo "::error::the engine wheel does not match the hash from the wheels job"
            exit 1
          fi
          python -m pip install --no-index --only-binary :all: --no-deps "$1"

      # Optional (Doppler). Runs only when the repository variables
      # DOPPLER_COUNTS_IDENTITY_ID, DOPPLER_COUNTS_PROJECT and
      # DOPPLER_COUNTS_CONFIG are all set (the identity is separate from the
      # deploy job's and limited to the social-media project) (no default: use a dedicated project that holds social-media
      # credentials only, never the shared `ci` project); otherwise the
      # keys come from GitHub Actions secrets in the next step. COUNTS_SECRET_NAMES
      # (default: the three names below) is the allow-list to fetch; a name
      # missing from the Doppler config fails the run. Values come back as one
      # masked output that only the next step reads; nothing is written to the
      # job environment, and no long-lived token is used.
      - name: Fetch count-source keys from Doppler
        id: doppler
        if: ${{ vars.DOPPLER_COUNTS_IDENTITY_ID != '' && vars.DOPPLER_COUNTS_PROJECT != '' && vars.DOPPLER_COUNTS_CONFIG != '' }}
        uses: ChiefGyk3D/git-your-ship-together/.github/actions/doppler-secrets@f9a1ac2596926cc2e4fc8bd1e025f8d9c38c8ea1 # v1.30.0
        with:
          project: ${{ vars.DOPPLER_COUNTS_PROJECT }}
          config: ${{ vars.DOPPLER_COUNTS_CONFIG }}
          identity-id: ${{ vars.DOPPLER_COUNTS_IDENTITY_ID }}
          export: outputs
          names: ${{ vars.COUNTS_SECRET_NAMES || 'YOUTUBE_API_KEY,TWITCH_CLIENT_ID,TWITCH_CLIENT_SECRET' }}

      # The only step with the keys. Each comes from Doppler when that step
      # ran, else from the GitHub Actions secret of the same name; a key that
      # is not set is empty and its source is skipped by the engine. A failed
      # source keeps its old number. The suspect-value guard is never
      # overridden.
      - name: Refresh the counts
        env:
          YOUTUBE_API_KEY: ${{ fromJSON(steps.doppler.outputs.secrets || '{}').YOUTUBE_API_KEY || secrets.YOUTUBE_API_KEY }}
          TWITCH_CLIENT_ID: ${{ fromJSON(steps.doppler.outputs.secrets || '{}').TWITCH_CLIENT_ID || secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ fromJSON(steps.doppler.outputs.secrets || '{}').TWITCH_CLIENT_SECRET || secrets.TWITCH_CLIENT_SECRET }}
        run: python3 -I .github/scripts/test-counts.py --config examples/instance/site.yaml --out "$RUNNER_TEMP/counts"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: counts-numbers
          path: ${{ runner.temp }}/counts/numbers.json
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build the site
    needs: counts
    # Refuse any ref other than main. !cancelled() lets the build run when the
    # counts job was skipped on request; it still needs the counts job to have
    # succeeded unless the run asked to skip it (a failed wheels or counts job
    # blocks the build, never a silent pass).
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main'
      && (inputs.skip_counts || needs.counts.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # download the previous deployment's assets inventory
    # No `environment` and no secrets here, on purpose: `pip install .` runs
    # dependency build scripts.
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          # audit, not block: artifact upload goes to a blob host whose name
          # varies per run and cannot be listed without a wildcard (unsupported
          # here), so a block-mode list would stop every build at upload. This
          # job holds no secrets and installs from hashed lockfiles. Audit logs
          # the destinations, so a measured list can follow from a run's report
          # (docs/deploy.md, Egress control). The deploy job stays in block.
          egress-policy: audit

      # Egress canary, as in git-your-ship-together (EX-0001): a runner with
      # broken DNS makes block mode fail confusingly, so say which it is first.
      - name: Egress canary
        timeout-minutes: 2
        run: |
          set -u
          bad=""
          for name in github.com api.github.com pypi.org; do
            if ! timeout 8 bash -c "exec 3<>/dev/tcp/${name}/443" 2>/dev/null; then
              bad="$bad $name"
            fi
          done
          if [ -n "$bad" ]; then
            echo "::error title=egress canary::cannot reach:${bad}. Either the runner network is broken (rerun the job) or the allow-list is wrong (docs/deploy.md)."
            exit 1
          fi
          echo "egress canary: allowed hosts accept TCP 443"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fetch the last successful deployment's inventory. This runs right after
      # checkout, before setup-python or any pip install, so nothing installed
      # from PyPI can be on PATH yet. The step pins PATH to the system
      # directories, calls the runner image's GitHub CLI by absolute path, and
      # holds the built-in token (it can only read artifacts) in this step's env
      # only. No earlier deployment is a notice, not an error.
      - name: Download the previous assets inventory
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          PATH=/usr/bin:/bin
          export PATH
          if [ ! -x /usr/bin/gh ]; then
            echo "::warning::/usr/bin/gh not found on this runner; the purge list stays empty"
          elif previous="$(/usr/bin/gh run list --workflow deploy-test.yml --branch main \
              --status success --limit 1 --json databaseId \
              --jq '.[0].databaseId // empty')" && [ -n "$previous" ]; then
            if /usr/bin/gh run download "$previous" --name site-assets-inventory \
                --dir previous-inventory; then
              echo "::notice::downloaded the inventory of run $previous"
            else
              echo "::notice::the earlier deployment has no assets inventory"
            fi
          else
            echo "::notice::no earlier successful deployment found"
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The numbers file from the counts job is data: it goes into its own
      # empty directory and the build reads it only through --numbers, which
      # validates it. It is never copied into the output. With skip_counts the
      # build reads the committed numbers.json beside the config instead.
      - if: ${{ !inputs.skip_counts }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: counts-numbers
          path: counts-in

      # The link manifest and the assets inventory are written next to the
      # site directory (site-out.manifest.json, site-out.assets.json), never
      # inside it, so Pages cannot publish them.
      - name: Build the site
        env:
          SKIP_COUNTS: ${{ inputs.skip_counts && 'true' || 'false' }}
        run: |
          set -eu
          python -m pip install --require-hashes -r requirements-build.txt
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install --no-deps --no-build-isolation .
          if [ "$SKIP_COUNTS" = "true" ]; then
            reach-around build --config examples/instance/site.yaml --out site-out
          else
            reach-around build --config examples/instance/site.yaml --numbers counts-in/numbers.json --out site-out
          fi
          test -z "$(find site-out -iname '*manifest*')"
          test -z "$(find site-out -iname '*assets.json')"
          test -f site-out.manifest.json
          test -f site-out.assets.json

      # Compare it with this build's inventory. No token here: this step runs the
      # installed reach-around, which is dependency code. A missing or unreadable
      # previous inventory leaves the list empty and the purge step idle; the
      # deploy is never blocked here.
      - name: List edge-cache paths to purge
        run: |
          set -eu
          printf '# no previous deployment inventory; nothing to purge\n' > site-purge-list.txt
          if [ -f previous-inventory/site-out.assets.json ]; then
            if reach-around deploy-purge-list \
                --previous previous-inventory/site-out.assets.json \
                --current site-out.assets.json > site-purge-list.new; then
              mv site-purge-list.new site-purge-list.txt
            else
              echo "::warning::could not compare inventories; the purge list is empty"
            fi
          else
            echo "::notice::no previous inventory; the purge list is empty"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-out
          path: site-out
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-manifest
          path: site-out.manifest.json
          if-no-files-found: error
          retention-days: 1

      # Kept for 90 days: the next deployment compares against it. Not part of
      # the Pages upload directory.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-assets-inventory
          path: site-out.assets.json
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-purge-list
          path: site-purge-list.txt
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy test site and Worker
    needs: build
    # Refuse any ref other than main. The `test` environment can also restrict
    # deployment branches and require a reviewer (docs/deploy.md).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test
    permissions:
      contents: read
      id-token: write # Doppler OIDC; only this job, never the build job
    # No job-level env: the Cloudflare token is fetched from Doppler only after
    # the last install step, so no install script ever runs with it present.
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          # block, with an explicit list (no wildcards). The runner's own
          # infrastructure hosts are allowed by the agent. This list is
          # UNMEASURED: it comes from what each step is known to reach, not
          # from a recorded run. Wrangler may reach hosts not listed here.
          # An unmeasured allow-list fails safe: a blocked host is named in the
          # job log and nothing was sent. Add the host here, note it in
          # docs/deploy.md (Egress control), and re-run.
          egress-policy: block
          allowed-endpoints: >-
            api.cloudflare.com:443
            api.doppler.com:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443

      # Egress canary, as in git-your-ship-together (EX-0001): a runner with
      # broken DNS makes block mode fail confusingly, so say which it is first.
      - name: Egress canary
        timeout-minutes: 2
        run: |
          set -u
          bad=""
          for name in github.com api.github.com api.cloudflare.com api.doppler.com registry.npmjs.org; do
            if ! timeout 8 bash -c "exec 3<>/dev/tcp/${name}/443" 2>/dev/null; then
              bad="$bad $name"
            fi
          done
          if [ -n "$bad" ]; then
            echo "::error title=egress canary::cannot reach:${bad}. Either the runner network is broken (rerun the job) or the allow-list is wrong (docs/deploy.md)."
            exit 1
          fi
          echo "egress canary: allowed hosts accept TCP 443"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-out
          path: site-out

      # The manifest is a separate artifact so it never sits in the Pages
      # upload directory. It goes into its own empty directory, never the
      # working directory, so nothing in it can shadow a Python module.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-manifest
          path: manifest-in

      # URL paths to purge after the publish, computed in the build job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-purge-list
          path: purge-in

      # Checks the plain (non-secret) configuration before anything is
      # fetched. The Cloudflare token is checked after the Doppler step.
      - name: Check configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          RATELIMIT_NAMESPACE_ID: ${{ vars.RATELIMIT_NAMESPACE_ID }}
          SITE_HOST: ${{ vars.SITE_HOST }}
          LINK_IDS: ${{ vars.LINK_IDS }}
          # Optional: set it to route /e/* on the site host to the Worker.
          ZONE_NAME: ${{ vars.ZONE_NAME }}
          # Optional: the Live tab poller. It is ENABLED when LIVE_TWITCH_HANDLE
          # or LIVE_KICK_HANDLE is set; then LIVE_KV_ID is required (docs/live.md).
          LIVE_TWITCH_HANDLE: ${{ vars.LIVE_TWITCH_HANDLE }}
          LIVE_KICK_HANDLE: ${{ vars.LIVE_KICK_HANDLE }}
          LIVE_KV_ID: ${{ vars.LIVE_KV_ID }}
        run: |
          set -eu
          for name in CLOUDFLARE_ACCOUNT_ID PAGES_PROJECT D1_DATABASE_ID \
                      RATELIMIT_NAMESPACE_ID SITE_HOST LINK_IDS; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              echo "::error::$name is not set (see docs/deploy.md)"
              exit 1
            fi
          done
          # Values land in a config file below, so allow only plain characters.
          printf '%s' "$D1_DATABASE_ID" | grep -Eq '^[0-9a-f-]{36}$' \
            || { echo "::error::D1_DATABASE_ID is not a UUID"; exit 1; }
          printf '%s' "$RATELIMIT_NAMESPACE_ID" | grep -Eq '^[0-9]{1,12}$' \
            || { echo "::error::RATELIMIT_NAMESPACE_ID is not a number"; exit 1; }
          printf '%s' "$SITE_HOST" | grep -Eq '^[a-z0-9.-]{3,253}$' \
            || { echo "::error::SITE_HOST is not a plain hostname"; exit 1; }
          if [ -n "${ZONE_NAME:-}" ]; then
            printf '%s' "$ZONE_NAME" | grep -Eq '^[a-z0-9.-]{3,253}$' \
              || { echo "::error::ZONE_NAME is not a plain hostname"; exit 1; }
          fi
          printf '%s' "$PAGES_PROJECT" | grep -Eq '^[a-z0-9-]{1,58}$' \
            || { echo "::error::PAGES_PROJECT is not a valid project name"; exit 1; }
          printf '%s' "$LINK_IDS" | grep -Eq '^\[("[a-z0-9-]{1,40}"(, ?)?)+\]$' \
            || { echo "::error::LINK_IDS must be a JSON array of link ids"; exit 1; }
          # Live Worker: enabled by a handle. Fail closed: no KV id, no deploy.
          if [ -n "${LIVE_TWITCH_HANDLE:-}" ] || [ -n "${LIVE_KICK_HANDLE:-}" ]; then
            if [ -z "${LIVE_KV_ID:-}" ]; then
              echo "::error::The Live Worker is enabled (LIVE_TWITCH_HANDLE or LIVE_KICK_HANDLE is set) but the repository variable LIVE_KV_ID is not set (docs/live.md)"
              exit 1
            fi
            # [[ =~ ]] tests the WHOLE value; grep tests line by line and would
            # let a value with a valid first line and a second line through.
            [[ "$LIVE_KV_ID" =~ ^[0-9a-f]{32}$ ]] \
              || { echo "::error::LIVE_KV_ID must be 32 lowercase hex characters"; exit 1; }
            if [[ "$LIVE_KV_ID" =~ ^0{32}$ ]]; then
              echo "::error::LIVE_KV_ID is the all-zero placeholder"
              exit 1
            fi
            if [ -n "${LIVE_TWITCH_HANDLE:-}" ]; then
              [[ "$LIVE_TWITCH_HANDLE" =~ ^[A-Za-z0-9_]{1,25}$ ]] \
                || { echo "::error::LIVE_TWITCH_HANDLE is not a valid Twitch login"; exit 1; }
            fi
            if [ -n "${LIVE_KICK_HANDLE:-}" ]; then
              [[ "$LIVE_KICK_HANDLE" =~ ^[A-Za-z0-9_-]{1,40}$ ]] \
                || { echo "::error::LIVE_KICK_HANDLE is not a valid Kick slug"; exit 1; }
            fi
          fi

      # Reads the downloaded manifest. No secret is in this step's env, and
      # python runs isolated (-I: no working-directory imports), so a hostile
      # artifact file cannot execute with the token present. A mismatch is a
      # warning: clicks on unlisted ids are rejected by the Worker.
      - name: Verify the build manifest
        env:
          LINK_IDS: ${{ vars.LINK_IDS }}
        run: |
          set -eu
          manifest="manifest-in/site-out.manifest.json"
          [ "$(find manifest-in -mindepth 1 | wc -l)" = 1 ] \
            || { echo "::error::manifest-in must hold exactly one file"; exit 1; }
          if [ -f "$manifest" ] && [ ! -L "$manifest" ]; then
            :
          else
            echo "::error::$manifest is not a regular file"
            exit 1
          fi
          python3 -I .github/scripts/verify-manifest.py "$manifest"

      # --ignore-scripts: wrangler runs without its dependencies' install
      # scripts (verified with `wrangler --version` on Node 24), so none run.
      # This step has no secret in its environment either way.
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --ignore-scripts

      # worker/wrangler.toml holds fake placeholder ids. Write a deploy copy
      # with the real values (none is a secret); it is never committed.
      - name: Write deploy config
        working-directory: worker
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          RATELIMIT_NAMESPACE_ID: ${{ vars.RATELIMIT_NAMESPACE_ID }}
          SITE_HOST: ${{ vars.SITE_HOST }}
          LINK_IDS: ${{ vars.LINK_IDS }}
          ZONE_NAME: ${{ vars.ZONE_NAME }}
          LIVE_TWITCH_HANDLE: ${{ vars.LIVE_TWITCH_HANDLE }}
          LIVE_KICK_HANDLE: ${{ vars.LIVE_KICK_HANDLE }}
          LIVE_KV_ID: ${{ vars.LIVE_KV_ID }}
        run: |
          set -eu
          sed \
            -e "s|^database_id = \"[^\"]*\"|database_id = \"${D1_DATABASE_ID}\"|" \
            -e "s|^namespace_id = \"[^\"]*\"|namespace_id = \"${RATELIMIT_NAMESPACE_ID}\"|" \
            -e "s|^SITE_HOST = \"[^\"]*\"|SITE_HOST = \"${SITE_HOST}\"|" \
            -e "s|^LINK_IDS = '[^']*'|LINK_IDS = '${LINK_IDS}'|" \
            wrangler.toml > wrangler.deploy.toml
          grep -qF "${D1_DATABASE_ID}" wrangler.deploy.toml
          grep -qF "${SITE_HOST}" wrangler.deploy.toml
          # Optional route so click pings to /e/c/<id> on the site host reach
          # the Worker. Values were validated in "Check configuration".
          if [ -n "${ZONE_NAME:-}" ]; then
            printf '\n[[routes]]\npattern = "%s/e/*"\nzone_name = "%s"\n' \
              "${SITE_HOST}" "${ZONE_NAME}" >> wrangler.deploy.toml
            grep -qF "pattern = \"${SITE_HOST}/e/*\"" wrangler.deploy.toml
          fi
          # Live Worker (docs/live.md). Enabled by a handle; then the KV id is
          # required and is checked again here (the values were validated in
          # "Check configuration"; this is the second lock). Adds the LIVE_KV
          # binding, the handles and the 2-minute cron. When not enabled the
          # file is unchanged. A placeholder id can never ship.
          if [ -n "${LIVE_TWITCH_HANDLE:-}" ] || [ -n "${LIVE_KICK_HANDLE:-}" ]; then
            [[ "${LIVE_KV_ID:-}" =~ ^[0-9a-f]{32}$ ]] \
              || { echo "::error::LIVE_KV_ID must be 32 lowercase hex characters when the Live Worker is enabled"; exit 1; }
            if [[ "${LIVE_KV_ID}" =~ ^0{32}$ ]]; then
              echo "::error::LIVE_KV_ID is the all-zero placeholder"
              exit 1
            fi
            if [ -n "${LIVE_TWITCH_HANDLE:-}" ]; then
              [[ "$LIVE_TWITCH_HANDLE" =~ ^[A-Za-z0-9_]{1,25}$ ]] \
                || { echo "::error::LIVE_TWITCH_HANDLE is not a valid Twitch login"; exit 1; }
              sed -i "/^\[vars\]$/a LIVE_TWITCH_HANDLE = \"${LIVE_TWITCH_HANDLE}\"" wrangler.deploy.toml
            fi
            if [ -n "${LIVE_KICK_HANDLE:-}" ]; then
              [[ "$LIVE_KICK_HANDLE" =~ ^[A-Za-z0-9_-]{1,40}$ ]] \
                || { echo "::error::LIVE_KICK_HANDLE is not a valid Kick slug"; exit 1; }
              sed -i "/^\[vars\]$/a LIVE_KICK_HANDLE = \"${LIVE_KICK_HANDLE}\"" wrangler.deploy.toml
            fi
            sed -i 's|^crons = \["5 \* \* \* \*"\]$|crons = ["5 * * * *", "*/2 * * * *"]|' wrangler.deploy.toml
            printf '\n[[kv_namespaces]]\nbinding = "LIVE_KV"\nid = "%s"\n' "${LIVE_KV_ID}" >> wrangler.deploy.toml
            grep -qxF 'crons = ["5 * * * *", "*/2 * * * *"]' wrangler.deploy.toml
            grep -qxF "id = \"${LIVE_KV_ID}\"" wrangler.deploy.toml
            # No all-zero placeholder id may remain on an active line.
            if grep -v '^[[:space:]]*#' wrangler.deploy.toml | grep -Eq '"0{32}"'; then
              echo "::error::a placeholder KV id is still in the deploy config"
              exit 1
            fi
          fi

      # Smoke test with no secret in the environment.
      - name: Confirm wrangler runs
        working-directory: worker
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npx --no-install wrangler --version

      # From here on the token is in the job environment: Doppler exports every
      # secret in the config it reads, so the `ci` config must hold only what
      # this deploy needs. No install step follows. On a repository without
      # Doppler the same name comes from the GitHub `test` environment secret.
      - name: Fetch Cloudflare credentials from Doppler
        uses: ChiefGyk3D/git-your-ship-together/.github/actions/doppler-secrets@f9a1ac2596926cc2e4fc8bd1e025f8d9c38c8ea1 # v1.30.0
        with:
          project: reach-around
          config: ci
          identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          token: ${{ secrets.DOPPLER_TOKEN }}

      # Tests that the token exists without printing it. Neither Doppler nor
      # the GitHub secret supplied it: fail, never skip.
      - name: Require the Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -eu
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Cloudflare token present (value not shown)."
          else
            echo "::error::CLOUDFLARE_API_TOKEN is not set: Doppler (project reach-around, config ci) and the GitHub secret both gave nothing (see docs/deploy.md)"
            exit 1
          fi

      # The wrangler steps carry the Cloudflare token.
      - name: Apply D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --no-install wrangler d1 migrations apply DB --remote --config wrangler.deploy.toml

      - name: Deploy the Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --no-install wrangler deploy --config wrangler.deploy.toml

      - name: Publish the site to Pages
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
          WRANGLER_SEND_METRICS: "false"
        run: >-
          npx --no-install wrangler pages deploy ../site-out
          --project-name "$PAGES_PROJECT"
          --branch main
          --commit-dirty=true

      # Optional backstop. Skipped with a notice unless the repository secret
      # CLOUDFLARE_PURGE_TOKEN (scope: Zone > Cache Purge, one zone only) and the
      # variable ZONE_ID are set. It never fails the deploy: a refused purge is
      # a warning and a line in the job summary. The purge token stays a GitHub
      # `test` environment secret, never in the Doppler `ci` config, so it
      # reaches this step only and not the wrangler steps. The script gives it
      # to curl on stdin. The deploy token is blanked here: this step has no
      # use for it.
      - name: Purge changed paths from the edge cache (optional)
        env:
          CLOUDFLARE_API_TOKEN: ""
          CLOUDFLARE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          ZONE_ID: ${{ vars.ZONE_ID }}
          SITE_HOST: ${{ vars.SITE_HOST }}
        run: bash .github/scripts/purge-cache.sh purge-in/site-purge-list.txt
