# SPDX-License-Identifier: Apache-2.0
# Release: a `v*` tag builds, tests, scans, publishes and signs the container image
# on GHCR, then verifies it from the outside. Both legs are
# ChiefGyk3D/git-your-ship-together reusable workflows (container-release.yml and
# verify-published.yml), pinned by commit. Inputs match what those files declare at
# that commit. The only credential is the run's GITHUB_TOKEN; DOPPLER_TOKEN is not
# passed and no Doppler or Docker Hub input is set. See docs/releasing.md.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Tag matches the package version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the tag with reach_around.__version__
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/reach_around/__init__.py)"
          if [ -z "$version" ] || [ "$TAG" != "v${version}" ]; then
            echo "tag '${TAG}' does not match package version '${version}'" >&2
            exit 1
          fi

  release:
    name: Build, scan, publish, sign
    needs: [check-version]
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/container-release.yml@f344c638e1316d43514a41e4a22f172583c271fc # v1.26.0
    permissions:
      contents: read
      packages: write  # push the image to GHCR
      id-token: write  # cosign keyless signing and attestations
      attestations: write  # record SLSA build provenance
      security-events: write  # Trivy SARIF upload
    with:
      dockerfile: Containerfile
      push: true
      # The version comes from the tag. Alpha: no major-only tag, and `latest`
      # follows the newest release tag.
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=sha
        type=raw,value=latest
      docker-test-command: docker run --rm "$IMAGE" --version
      require-non-root: true
      probe-read-only: true
      probe-command: --version
      egress-policy: block

  verify:
    name: Verify the published image
    needs: [release]
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/verify-published.yml@f344c638e1316d43514a41e4a22f172583c271fc # v1.26.0
    permissions:
      contents: read
      packages: read  # pull the published image to verify it
    with:
      image: ${{ needs.release.outputs.image }}
      # The signing identity is the reusable workflow file, not this repository.
      # `gh attestation verify --owner` (run by verify-published) pins the owner;
      # a per-repository pin needs a GYST input (tracked there).
      identity-regexp: ^https://github.com/ChiefGyk3D/git-your-ship-together/\.github/workflows/container-release\.yml@
      test-command: docker run --rm "$IMAGE" --version
