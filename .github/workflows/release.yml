# SPDX-License-Identifier: Apache-2.0
# Release: a `vMAJOR.MINOR.PATCH` tag builds, tests, scans, publishes and signs the container image
# on GHCR, then verifies it from the outside. Both legs are
# ChiefGyk3D/git-your-ship-together reusable workflows (container-release.yml and
# verify-published.yml), pinned by commit. Inputs match what those files declare at
# that commit. The only credential is the run's GITHUB_TOKEN; DOPPLER_TOKEN is not
# passed and no Doppler or Docker Hub input is set. See docs/releasing.md.
name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

# One release at a time for the whole repository (not one per tag): the moving
# tags (latest, major.minor) are written by whichever run finishes last, so two
# tags must never publish at once. A queued run waits; the check-version job
# below refuses a tag that is no longer the highest, so an older tag cannot
# overwrite what a newer one published.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Tag matches the package version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the tag with reach_around.__version__
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/reach_around/__init__.py)"
          if [ -z "$version" ] || [ "$TAG" != "v${version}" ]; then
            echo "tag '${TAG}' does not match package version '${version}'" >&2
            exit 1
          fi
      - name: Refuse a tag that is not the highest release tag
        env:
          TAG: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: bash .github/scripts/check-release-tag.sh

  release:
    name: Build, scan, publish, sign
    needs: [check-version]
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/container-release.yml@01f397834f7acc553593abefbba135b18f580730 # v1.34.0
    permissions:
      contents: read
      packages: write  # push the image to GHCR
      id-token: write  # cosign keyless signing and attestations
      attestations: write  # record SLSA build provenance
      security-events: write  # Trivy SARIF upload
    with:
      dockerfile: Containerfile
      push: true
      # The version comes from the tag. Only the immutable tags are written here;
      # `latest` and MAJOR.MINOR move in the promote job below, after the
      # release tag is checked again against the remote. Alpha: no major-only tag.
      tags: |
        type=semver,pattern={{version}}
        type=sha
      docker-test-command: docker run --rm "$IMAGE" --version
      require-non-root: true
      probe-read-only: true
      probe-command: --version
      egress-policy: block

  verify:
    name: Verify the published image
    needs: [release]
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/verify-published.yml@01f397834f7acc553593abefbba135b18f580730 # v1.34.0
    permissions:
      contents: read
      packages: read  # pull the published image to verify it
    with:
      image: ${{ needs.release.outputs.image }}
      # The signing identity is the reusable workflow file, not this repository.
      # `gh attestation verify --owner` (run by verify-published) pins the owner;
      # a per-repository pin needs a GYST input (tracked there).
      identity-regexp: ^https://github.com/ChiefGyk3D/git-your-ship-together/\.github/workflows/container-release\.yml@
      test-command: docker run --rm "$IMAGE" --version

  # Moves `latest` and MAJOR.MINOR to the verified image. The tag is checked
  # again in the same step as the retag, so a newer tag pushed, or this tag
  # moved, while the build ran stops the promotion. The runs share one
  # repository-wide concurrency group, so no other release promotes meanwhile.
  promote:
    name: Promote the moving tags
    needs: [check-version, release, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write  # retag the already published image on GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Re-check the tag, then retag
        env:
          TAG: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          IMAGE: ${{ needs.release.outputs.image }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: bash .github/scripts/promote-release-tags.sh
