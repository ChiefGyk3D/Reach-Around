# SPDX-License-Identifier: Apache-2.0
# Publishes docs/wiki/ to the GitHub Wiki from main only (#799, epic #795).
#
# The repository is the source of truth: page sources live in docs/wiki/ and are
# reviewed in pull requests. The wiki has no pull requests, so it is a generated
# mirror; every publish replaces all of its pages.
#
# The publish itself is ChiefGyk3D/git-your-ship-together's wiki-publish.yml,
# pinned by commit like every other GYST call here. It runs the generate command
# in a read-only job, then a separate job with contents: write (and none of this
# repository's code) pushes the tree to the .wiki repository as
# github-actions[bot], with the job token only. It publishes only from a run on
# the default branch and never from a pull request. This workflow has no
# pull_request trigger at all, and both jobs skip forks and any run not on the
# default branch. A run whose commit is no longer the default branch head is refused.
#
# Before generating, the generate command runs scripts/check-wiki-scrub.py and
# fails closed when that file is missing (it lands with #800), then
# scripts/wiki-flatten.py, which flattens docs/wiki/ into the wiki layout and
# rewrites relative links. The naming rule is in that script's docstring.
#
# The wiki must be switched on by the owner (repository setting) and have its
# first page made once in the UI; until then the precheck job skips with a
# message, and a missing first page fails the publish job with the step named.
name: Wiki sync

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
  workflow_dispatch:

permissions:
  contents: read

# Syncs queue one behind the other and a publish is never cancelled halfway.
# Not the literal group `wiki`: the reusable's publish job holds that one.
concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  precheck:
    name: Is the wiki switched on
    # A fork has its own wiki and its own token; never publish from one.
    if: ${{ github.event.repository.fork == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.wiki.outputs.enabled }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
          disable-sudo: true

      # Stale-run protection: a re-run of an older run must not overwrite newer
      # content, so the run's commit has to be the default branch's current head.
      - name: Require this run's commit to be the default branch head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')
          if [ "$head" != "$RUN_SHA" ]; then
            echo "::error title=Wiki sync stale run::this run's commit is not the current head of the default branch; refusing to publish"
            exit 1
          fi

      - name: Read the wiki setting
        id: wiki
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          has_wiki=$(gh api "repos/$REPO" --jq '.has_wiki')
          if [ "$has_wiki" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Wiki sync skipped::the repository wiki is switched off (Settings, Features, Wikis); nothing was published"
            echo "Wiki sync skipped: the repository wiki is switched off, nothing was published." >> "$GITHUB_STEP_SUMMARY"
          fi

  wiki:
    name: Publish docs/wiki to the wiki
    needs: precheck
    if: ${{ needs.precheck.outputs.enabled == 'true' && github.event.repository.fork == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/wiki-publish.yml@ff658b7c11a55eea1394af5fd1a3a1b4b09d9cd0 # v1.36.0
    permissions:
      contents: write # the reusable's publish job only; its generate job holds contents: read
    with:
      timeout-minutes: 5
      publish: true
      egress-policy: block
      generate-command: |
        if [ ! -f scripts/check-wiki-scrub.py ]; then
          echo "::error title=Wiki scrub::scripts/check-wiki-scrub.py is missing; refusing to publish unscanned content"
          exit 1
        fi
        python scripts/check-wiki-scrub.py
        python scripts/wiki-flatten.py --src docs/wiki --out "$OUT_DIR" \
          --asset-base "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/wiki/"
