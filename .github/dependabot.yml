version: 2
updates:
  # Every action is pinned to a commit with a version comment; Dependabot reads the comment and moves both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A release that turns out to be malicious is usually pulled within days; waiting a week costs nothing.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, github-actions]

  # requirements-dev.txt is a pip-compile lock (not universal), so the pip ecosystem.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns: ["*"]
    labels: [dependencies, python]

  # The Cloudflare Worker's lockfile.
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      worker-dependencies:
        patterns: ["*"]
    labels: [dependencies, javascript]
