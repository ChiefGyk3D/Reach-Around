[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reach-around"
dynamic = ["version"]
description = "Build a static link page from a validated config."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "PyYAML",
    "pydantic>=2",
    "Jinja2",
]

[project.scripts]
reach-around = "reach_around.cli:main"

[tool.setuptools.dynamic]
version = { attr = "reach_around.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reach_around = ["py.typed", "site/templates/*.html", "site/templates/blocks/*.html", "site/static/*", "site/static/icons/*", "site/static/fonts/*", "site/data/*.txt", "preview_assets/*", "editor_assets/*", "store/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
