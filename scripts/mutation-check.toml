what = "a zero hourly gate budget no longer closes the gate"
find = 'if (limit <= 0) return "budget";'
replace = ''
equivalent = "the conditional insert in the same batch is guarded by WHERE ?3 > 0, so a zero limit reserves nothing and the unit check answers budget anyway; the early return only saves two statements"

[[mutation]]
id = "budget-view-route-name-confusion"
file = "src/kit/budgets.ts"
group = "limits"
what = "an unknown route name is granted a budget"
