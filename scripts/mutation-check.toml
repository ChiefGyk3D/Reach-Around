replace = 'DO UPDATE SET count = count + 1 WHERE count <= ?3`, // CONTROL:budget'

[[mutation]]
id = "limits-zero-limit-admits"
file = "src/kit/limits.ts"
group = "limits"
what = "limit 0 stores a row and grants a unit"
find = 'SELECT ?1, ?2, 1 WHERE ?3 > 0'
replace = 'SELECT ?1, ?2, 1 WHERE ?3 >= 0'

[[mutation]]
id = "limits-limiter-throw-fails-open"
file = "src/kit/limits.ts"
group = "limits"
what = "a rate limiter that throws lets the request through"
find = '''  } catch {
    return false;
  }
}

/** Most counter rows'''
