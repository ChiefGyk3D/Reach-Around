group = "gate"
what = "the per-day new-lead cap is lifted"
find = 'deps.newLeadsPerDay ?? NEW_LEADS_PER_DAY)'
replace = 'deps.newLeadsPerDay ?? 100000)'

[[mutation]]
id = "gate-new-lead-unit-never-refunded"
