# Mutation list for scripts/mutation-check.py (issue #270). See docs/security/abuse-suite.md.
#
# Each [[mutation]] is ONE edit to ONE file under worker/: `find` must occur exactly once in `file`
# (the script checks it), and is replaced by `replace`. `tests` names the vitest files that must catch
# it (or `group`, a key of [groups]). An entry may carry `equivalent = "reason"` only when the edit
# cannot change behavior a caller can see, or another layer provably covers it; the reason is
# recorded so the table never hides a survivor. Strings are TOML literal strings (single quotes), so
# the TypeScript text is written as it appears in the source.

default_tests = [
  "test/abuse/ab3-gate-bypass.test.ts",
  "test/abuse/ab4-token.test.ts",
  "test/abuse/ab8-privacy.test.ts",
  "test/abuse/ab9-alerts.test.ts",
  "test/abuse/ab10-cost.test.ts",
  "test/abuse/ab12-direct.test.ts",
  "test/kit/gate.test.ts",
  "test/kit/inquiry.test.ts",
  "test/kit/token.test.ts",
  "test/kit/session.test.ts",
  "test/kit/input.test.ts",
  "test/kit/body.test.ts",
  "test/kit/limits.test.ts",
  "test/kit/log.test.ts",
  "test/kit/turnstile.test.ts",
  "test/kit/budgets.test.ts",
  "test/alerts/alerts.test.ts",
  "test/alerts/hardening.test.ts",
]

[groups]
gate = ["test/abuse/ab3-gate-bypass.test.ts", "test/abuse/ab4-token.test.ts", "test/abuse/ab8-privacy.test.ts", "test/abuse/ab10-cost.test.ts", "test/kit/gate.test.ts", "test/abuse/ab12-direct.test.ts"]
token = ["test/abuse/ab4-token.test.ts", "test/abuse/ab3-gate-bypass.test.ts", "test/kit/token.test.ts", "test/kit/gate.test.ts", "test/abuse/ab12-direct.test.ts"]
session = ["test/abuse/ab4-token.test.ts", "test/kit/session.test.ts", "test/kit/gate.test.ts", "test/kit/inquiry.test.ts", "test/abuse/ab12-direct.test.ts"]
inquiry = ["test/abuse/ab9-alerts.test.ts", "test/abuse/ab4-token.test.ts", "test/abuse/ab10-cost.test.ts", "test/kit/inquiry.test.ts", "test/abuse/ab12-direct.test.ts"]
input = ["test/abuse/ab9-alerts.test.ts", "test/abuse/ab10-cost.test.ts", "test/kit/input.test.ts", "test/kit/gate.test.ts", "test/abuse/ab12-direct.test.ts"]
body = ["test/abuse/ab10-cost.test.ts", "test/abuse/ab9-alerts.test.ts", "test/kit/body.test.ts", "test/kit/input.test.ts", "test/kit/inquiry.test.ts", "test/abuse/ab12-direct.test.ts"]
limits = ["test/abuse/ab10-cost.test.ts", "test/abuse/ab3-gate-bypass.test.ts", "test/kit/limits.test.ts", "test/kit/budgets.test.ts", "test/kit/gate.test.ts", "test/abuse/ab12-direct.test.ts"]
turnstile = ["test/abuse/ab10-cost.test.ts", "test/abuse/ab8-privacy.test.ts", "test/kit/turnstile.test.ts", "test/kit/gate.test.ts", "test/abuse/ab12-direct.test.ts"]
log = ["test/abuse/ab8-privacy.test.ts", "test/kit/log.test.ts"]
alerts = ["test/abuse/ab9-alerts.test.ts", "test/abuse/ab8-privacy.test.ts", "test/alerts/alerts.test.ts", "test/alerts/hardening.test.ts"]

# ---- gate.ts: the POST /k/gate pipeline ----

[[mutation]]
id = "gate-content-type-check-removed"
file = "src/kit/gate.ts"
group = "gate"
controls = ["gate-content-type"]
what = "the gate stops requiring the form content type (checked again in readForm)"
find = 'if (request.headers.get("content-type") !== FORM_CONTENT_TYPE) return fail("other");'
replace = 'if (false) return fail("other");'
equivalent = "readForm repeats the exact content-type test and ends in the same fixed refusal; only the log reason word differs (other versus size)"

[[mutation]]
id = "gate-bot-ua-check-removed"
file = "src/kit/gate.ts"
group = "gate"
controls = ["gate-bot-ua"]
what = "tool and crawler user agents are no longer refused"
find = 'if (isBotUserAgent(request.headers.get("user-agent"))) return fail("bot_ua");'
replace = 'if (false) return fail("bot_ua");'

[[mutation]]
id = "gate-declared-length-widened"
file = "src/kit/gate.ts"
group = "gate"
controls = ["gate-declared-length"]
what = "an over-cap Content-Length is no longer refused before the body read (readForm repeats it)"
find = 'Number(declared) > MAX_FORM_BYTES)) return fail("size");'
replace = 'Number(declared) > 1e9)) return fail("size");'
equivalent = "readForm applies the same declared-length cap before reading and the bounded reader enforces the byte cap, so the outcome is the same fixed refusal"

[[mutation]]
id = "gate-ip-minute-removed"
file = "src/kit/gate.ts"
group = "gate"
controls = ["gate-ip-minute"]
what = "the per-client minute limiter is skipped"
find = 'if (!(await checkIpMinute(env.GATE_LIMITER, key))) return fail("ip_minute");'
replace = 'if (false) return fail("ip_minute");'

[[mutation]]
id = "gate-network-allowance-removed"
file = "src/kit/gate.ts"
group = "gate"
controls = ["gate-check-ceiling"]
what = "the per-network allowance before Turnstile is skipped"
find = 'if (!(await checkIpMinute(checkLimiter, netKey))) return fail("route_budget");'
replace = 'if (false) return fail("route_budget");'

[[mutation]]
id = "gate-network-key-uses-client-key"
file = "src/kit/gate.ts"
group = "gate"
what = "the network allowance is keyed by the single client instead of the coarse network"
find = 'limiterKey(limiterSecret, secretText, "gnet", network)'
replace = 'limiterKey(limiterSecret, secretText, "gnet", address)'

[[mutation]]
id = "gate-turnstile-verdict-ignored"
file = "src/kit/gate.ts"
group = "gate"
controls = ["gate-route-budget", "turnstile"]
what = "a failed Turnstile or spent budget no longer stops the unlock"
find = 'if (verdict !== "ok") return fail('
replace = 'if (false) return fail('

[[mutation]]
id = "gate-budget-verdict-treated-as-ok"
file = "src/kit/gate.ts"
group = "gate"
what = "a replayed token or spent hourly budget comes back as ok"
find = 'return claim === "ok" ? "ok" : claim === "budget" ? "budget" : "failed";'
replace = 'return "ok";'

[[mutation]]
id = "gate-challenge-freshness-removed"
file = "src/kit/gate.ts"
group = "gate"
controls = ["turnstile-fresh"]
what = "a stale or far-future challenge time is accepted"
find = 'if (Math.abs(nowMs - at) > CHALLENGE_SKEW_MS) return "failed";'
replace = 'if (false) return "failed";'

[[mutation]]
id = "gate-challenge-future-allowed"
file = "src/kit/gate.ts"
group = "gate"
what = "only past challenge times are checked, a future one is accepted"
find = 'Math.abs(nowMs - at) > CHALLENGE_SKEW_MS'
replace = '(nowMs - at) > CHALLENGE_SKEW_MS'

[[mutation]]
id = "gate-challenge-skew-doubled"
