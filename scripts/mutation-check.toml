[[mutation]]
id = "gate-origin-check-removed"
file = "src/kit/gate.ts"
group = "gate"
controls = ["gate-origin"]
what = "any Origin is accepted on the gate POST"
find = 'ok = originAllowList(origins)(request);'
replace = 'ok = true;'

[[mutation]]
id = "gate-kill-switch-ignored"
