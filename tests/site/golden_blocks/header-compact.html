<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start - Example Creator</title>
<link rel="stylesheet" href="static/site.css">
<link rel="stylesheet" href="static/theme.css">
<script src="static/click.js" defer></script>
</head>
<body>
<main>
<header class="site-header header-compact">
<div class="header-row">
<img class="avatar" src="https://example.com/avatar.png" alt="" width="48" height="48" referrerpolicy="no-referrer">

<h1>Example Creator</h1>
</div>
<ul class="socials">
<li><a href="https://video.example.com/@example" rel="noopener noreferrer">Example Video</a></li>
</ul>

</header>
<ul class="blocks layout-list">
<li class="block"><a class="link" href="https://example.com/1" ping="/e/c/one" data-link-id="one" rel="noopener noreferrer">
<span class="link-title">One</span>
</a></li>
<li class="block"><a class="link" href="https://example.com/2" ping="/e/c/two" data-link-id="two" rel="noopener noreferrer">
<span class="link-title">Two</span>
</a></li>
</ul>
<footer>
<p class="privacy-link"><a href="privacy/">Privacy</a></p>
</footer>
</main>
</body>
</html>
