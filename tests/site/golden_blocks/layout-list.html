<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start - Example Creator</title>
<link rel="stylesheet" href="static/site.css">
<link rel="stylesheet" href="static/theme.css">
</head>
<body>
<main>
<header class="site-header header-compact">
<div class="header-row">

<h1>Example Creator</h1>
</div>

</header>
<ul class="blocks layout-list">
<li class="block block-text">
<div class="text">
<p>Hello <strong>world</strong></p>
<ul>
<li><a href="https://example.com/" rel="noopener noreferrer nofollow ugc">site</a></li>
</ul>
</div>
</li>
<li class="block block-image">
<img class="image" src="https://example.com/a.png" alt="A picture" loading="lazy" referrerpolicy="no-referrer">
</li>
<li class="block block-image">
<a class="image-link" href="https://example.com/b" rel="noopener noreferrer"><img class="image" src="img/b.png" alt="Linked" loading="lazy" referrerpolicy="no-referrer"></a>
</li>
<li class="block block-divider"><hr class="divider"></li>
<li class="block"><a class="link" href="https://example.com/1" rel="noopener noreferrer">
<span class="link-title">One</span>
</a></li>
<li class="block"><a class="link" href="https://example.com/2" rel="noopener noreferrer">
<span class="link-title">Two</span>
</a></li>
</ul>
</main>
</body>
</html>
